<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>鹈鹕骑车动画</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 50%, #4682B4 100%);
        }
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: #808080;
        }
        .sea {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 150px;
            background: #00BFFF;
        }
        .pelican {
            position: absolute;
            bottom: 150px;
            left: 50%;
            width: 100px;
            height: 100px;
            animation: ride 5s linear infinite;
        }
        .pelican-body {
            width: 100%;
            height: 100%;
            background: #FFD700;
            border-radius: 50%;
        }
        .pelican-wheel {
            position: absolute;
            bottom: -20px;
            width: 40px;
            height: 40px;
            background: #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .pelican-wheel.left {
            left: 10px;
        }
        .pelican-wheel.right {
            right: 10px;
        }
        @keyframes ride {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(50%); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="sea"></div>
        <div class="road"></div>
        <div class="pelican">
            <div class="pelican-body"></div>
            <div class="pelican-wheel left"></div>
            <div class="pelican-wheel right"></div>
        </div>
    </div>
</body>
</html>
