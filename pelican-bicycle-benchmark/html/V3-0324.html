<!DOCTYPE html>
<html>
<head>
    <title>Pelican Biking Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 60%, #1E90FF 100%);
            height: 100vh;
        }
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .road {
            position: absolute;
            bottom: 0;
            width: 300%;
            height: 100px;
            background: #555;
            animation: roadMove 8s linear infinite;
        }
        .road-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 5px;
            background: repeating-linear-gradient(to right, white 0%, white 20%, transparent 20%, transparent 40%);
            transform: translateY(-50%);
        }
        .sea {
            position: absolute;
            bottom: 100px;
            width: 300%;
            height: 100px;
            background: linear-gradient(to bottom, #1E90FF, #00BFFF);
            animation: seaMove 16s linear infinite;
        }
        .wave {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120"><path fill="rgba(30,144,255,0.7)" d="M0,64L48,80C96,96,192,128,288,128C384,128,480,96,576,85.3C672,75,768,85,864,96C960,107,1056,117,1152,117.3C1248,117,1344,107,1392,101.3L1440,96L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"></path></svg>');
            background-size: cover;
            animation: waveMove 8s linear infinite;
        }
        .sun {
            position: absolute;
            top: 50px;
            right: 100px;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #FFD700, #FFA500);
            border-radius: 50%;
        }
        .pelican {
            position: absolute;
            bottom: 150px;
            left: 50px;
            width: 120px;
            height: 80px;
            animation: bikeMove 8s linear infinite;
        }
        .pelican-body {
            position: absolute;
            width: 80px;
            height: 50px;
            background: white;
            border-radius: 40px 40px 30px 30px;
        }
        .pelican-head {
            position: absolute;
            top: -20px;
            left: 55px;
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 50%;
        }
        .pelican-beak {
            position: absolute;
            top: -10px;
            left: 80px;
            width: 40px;
            height: 15px;
            background: #FFA500;
            border-radius: 10px;
            transform: rotate(15deg);
        }
        .bike {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100px;
            height: 50px;
        }
        .bike-frame {
            position: absolute;
            width: 80px;
            height: 30px;
            border: 5px solid #333;
            border-radius: 5px;
        }
        .wheel {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-radius: 50%;
            background: transparent;
            animation: wheelRotate 1s linear infinite;
        }
        .wheel-1 {
            top: 20px;
            left: 0;
        }
        .wheel-2 {
            top: 20px;
            left: 70px;
        }
        .wheel-spoke {
            position: absolute;
            width: 2px;
            height: 15px;
            background: #333;
            top: 7px;
            left: 14px;
            transform-origin: center 0px;
        }
        .pedal {
            position: absolute;
            top: 40px;
            left: 20px;
            width: 10px;
            height: 20px;
            background: #333;
            border-radius: 5px;
            transform-origin: center 10px;
            animation: pedalRotate 1s linear infinite;
        }
        @keyframes bikeMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }
        @keyframes wheelRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pedalRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes roadMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-66.66%); }
        }
        @keyframes seaMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-33.33%); }
        }
        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="sun"></div>
        <div class="sea"></div>
        <div class="wave"></div>
        <div class="road">
            <div class="road-line"></div>
        </div>
        <div class="pelican">
            <div class="pelican-body"></div>
            <div class="pelican-head"></div>
            <div class="pelican-beak"></div>
            <div class="bike">
                <div class="bike-frame"></div>
                <div class="wheel wheel-1">
                    <div class="wheel-spoke" style="transform: rotate(0deg)"></div>
                    <div class="wheel-spoke" style="transform: rotate(60deg)"></div>
                    <div class="wheel-spoke" style="transform: rotate(120deg)"></div>
                    <div class="wheel-spoke" style="transform: rotate(180deg)"></div>
                    <div class="wheel-spoke" style="transform: rotate(240deg)"></div>
                    <div class="wheel-spoke" style="transform: rotate(300deg)"></div>
                </div>
                <div class="wheel wheel-2">
                    <div class="wheel-spoke" style="transform: rotate(0deg)"></div>
                    <div class="wheel-spoke" style="transform: rotate(60deg)"></div>
                    <div class="wheel-spoke" style="transform: rotate(120deg)"></div>
                    <div class="wheel-spoke" style="transform: rotate(180deg)"></div>
                    <div class="wheel-spoke" style="transform: rotate(240deg)"></div>
                    <div class="wheel-spoke" style="transform: rotate(300deg)"></div>
                </div>
                <div class="pedal"></div>
            </div>
        </div>
    </div>
</body>
</html>
