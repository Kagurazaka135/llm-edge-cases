<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>鹈鹕骑车</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 60%, #4682B4 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        
        .scene {
            position: relative;
            width: 100%;
            height: 70%;
        }
        
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: #333;
        }
        
        .road-line {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 8px;
            background: repeating-linear-gradient(
                to right,
                transparent,
                transparent 40px,
                yellow 40px,
                yellow 80px
            );
        }
        
        .penguin {
            position: absolute;
            bottom: 90px;
            left: 20%;
            transform: translateX(-50%);
            z-index: 10;
            animation: ride 8s linear infinite;
        }
        
        .bike-body {
            position: absolute;
            width: 120px;
            height: 60px;
            background: #FF4136;
            border-radius: 10px 0 0 10px;
            bottom: 0;
        }
        
        .wheel {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 8px solid #333;
            border-radius: 50%;
            bottom: -25px;
            animation: spin 1s linear infinite;
        }
        
        .front-wheel {
            right: -10px;
        }
        
        .back-wheel {
            left: 10px;
        }
        
        .spoke {
            position: absolute;
            width: 4px;
            height: 50px;
            background: #333;
            top: 50%;
            left: 50%;
            transform-origin: center;
        }
        
        .spoke:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg); }
        .spoke:nth-child(2) { transform: translate(-50%, -50%) rotate(60deg); }
        .spoke:nth-child(3) { transform: translate(-50%, -50%) rotate(120deg); }
        .spoke:nth-child(4) { transform: translate(-50%, -50%) rotate(180deg); }
        .spoke:nth-child(5) { transform: translate(-50%, -50%) rotate(240deg); }
        .spoke:nth-child(6) { transform: translate(-50%, -50%) rotate(300deg); }
        
        .pedal {
            position: absolute;
            width: 30px;
            height: 8px;
            background: #333;
            bottom: 15px;
            left: 50%;
            transform-origin: left center;
            animation: pedal-spin 1s linear infinite;
        }
        
        .penguin-body {
            position: absolute;
            width: 50px;
            height: 70px;
            background: white;
            border-radius: 50% 50% 40% 40%;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .penguin-beak {
            position: absolute;
            width: 30px;
            height: 15px;
            background: #FFA500;
            border-radius: 0 0 10px 10px;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .penguin-wing {
            position: absolute;
            width: 30px;
            height: 40px;
            background: white;
            border-radius: 50%;
            top: 10px;
            animation: wing-flap 0.5s ease-in-out infinite alternate;
        }
        
        .left-wing {
            left: -20px;
            transform-origin: right center;
        }
        
        .right-wing {
            right: -20px;
            transform-origin: left center;
        }
        
        .sea {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 80px;
            background: #1E90FF;
        }
        
        .wave {
            position: absolute;
            width: 100%;
            height: 10px;
            background: linear-gradient(to bottom, transparent, #00BFFF);
            border-radius: 50%;
            animation: wave 3s ease-in-out infinite;
        }
        
        .wave:nth-child(2) {
            animation-delay: -1s;
            opacity: 0.7;
        }
        
        .wave:nth-child(3) {
            animation-delay: -2s;
            opacity: 0.5;
        }
        
        .sun {
            position: absolute;
            top: 50px;
            right: 100px;
            width: 60px;
            height: 60px;
            background: #FFD700;
            border-radius: 50%;
            animation: sun-glow 4s ease-in-out infinite;
        }
        
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: cloud-move 20s linear infinite;
        }
        
        .cloud1 {
            width: 80px;
            height: 40px;
            top: 30px;
            left: 10%;
            animation-duration: 25s;
        }
        
        .cloud2 {
            width: 100px;
            height: 50px;
            top: 80px;
            left: 40%;
            animation-duration: 30s;
        }
        
        .cloud3 {
            width: 70px;
            height: 35px;
            top: 60px;
            left: 70%;
            animation-duration: 35s;
        }
        
        @keyframes ride {
            0% { left: -10%; }
            100% { left: 110%; }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pedal-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes wing-flap {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(10deg); }
        }
        
        @keyframes wave {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        
        @keyframes sun-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }
        
        @keyframes cloud-move {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        
        <div class="sea">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
        
        <div class="road">
            <div class="road-line"></div>
        </div>
        
        <div class="penguin">
            <div class="bike-body">
                <div class="wheel front-wheel">
                    <div class="spoke"></div>
                    <div class="spoke"></div>
                    <div class="spoke"></div>
                    <div class="spoke"></div>
                    <div class="spoke"></div>
                    <div class="spoke"></div>
                </div>
                <div class="wheel back-wheel">
                    <div class="spoke"></div>
                    <div class="spoke"></div>
                    <div class="spoke"></div>
                    <div class="spoke"></div>
                    <div class="spoke"></div>
                    <div class="spoke"></div>
                </div>
                <div class="pedal"></div>
            </div>
            <div class="penguin-body">
                <div class="penguin-beak"></div>
                <div class="penguin-wing left-wing"></div>
                <div class="penguin-wing right-wing"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const penguin = document.querySelector('.penguin');
            let position = -10;
            
            function animatePenguin() {
                position += 0.5;
                if (position > 110) {
                    position = -10;
                }
                penguin.style.left = position + '%';
                requestAnimationFrame(animatePenguin);
            }
            
            animatePenguin();
        });
    </script>
</body>
</html>
