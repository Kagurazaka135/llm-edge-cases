<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>鹈鹕骑车动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: linear-gradient(to bottom, #6ab7ff 40%, #ffd166 40%, #ffd166 45%, #118ab2 45%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .scene {
            position: relative;
            width: 100%;
            height: 45vh;
        }
        .road {
            position: absolute;
            bottom: 0;
            width: 300%;
            height: 35%;
            background: #5a5a5a;
            animation: roadMove 6s linear infinite;
        }
        .road-line {
            position: absolute;
            top: 45%;
            width: 100px;
            height: 10px;
            background: white;
            border-radius: 5px;
        }
        .bike {
            position: absolute;
            bottom: 35%;
            left: 20%;
            transform: translateX(-50%);
            z-index: 10;
            animation: bikeMove 1.5s ease-in-out infinite alternate;
        }
        .wheel {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 5px solid #333;
            border-radius: 50%;
            animation: wheelRotate 1s linear infinite;
        }
        .wheel::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #333;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .wheel.spoke {
            position: absolute;
            width: 5px;
            height: 100%;
            background: #333;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .wheel.spoke:nth-child(2) { transform: translateX(-50%) rotate(45deg); }
        .wheel.spoke:nth-child(3) { transform: translateX(-50%) rotate(90deg); }
        .wheel.spoke:nth-child(4) { transform: translateX(-50%) rotate(135deg); }
        .wheel.front { left: 50px; }
        .wheel.rear { right: 50px; }
        .frame {
            position: absolute;
            height: 5px;
            background: #333;
            width: 100px;
            top: 25px;
            left: -50px;
        }
        .frame::before {
            content: '';
            position: absolute;
            width: 60px;
            height: 5px;
            background: #333;
            transform: rotate(35deg);
            top: -25px;
            left: 25px;
        }
        .frame::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 5px;
            background: #333;
            transform: rotate(-55deg);
            top: 25px;
            left: 45px;
        }
        .seat {
            position: absolute;
            width: 20px;
            height: 10px;
            background: #333;
            top: 0;
            left: -50px;
            border-radius: 3px 3px 0 0;
        }
        .handlebar {
            position: absolute;
            width: 5px;
            height: 30px;
            background: #333;
            top: -10px;
            left: 50px;
        }
        .handlebar::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 5px;
            background: #333;
            top: 0;
            left: -15px;
        }
        .pelican {
            position: absolute;
            top: -50px;
            left: -30px;
            z-index: 5;
            animation: pelicanMove 1.5s ease-in-out infinite alternate;
        }
        .pelican-body {
            width: 40px;
            height: 30px;
            background: white;
            border-radius: 50% 50% 40% 40%;
            position: relative;
        }
        .pelican-head {
            width: 25px;
            height: 25px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: -15px;
            left: 30px;
        }
        .pelican-beak {
            position: absolute;
            width: 50px;
            height: 15px;
            background: #ff9e6d;
            border-radius: 50% 0 0 50%;
            top: -5px;
            left: 40px;
            transform: rotate(-10deg);
        }
        .pelican-beak::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 10px;
            background: #ff6b4a;
            border-radius: 0 0 0 10px;
            top: 5px;
            left: 20px;
        }
        .pelican-wing {
            position: absolute;
            width: 30px;
            height: 15px;
            background: white;
            border-radius: 50%;
            top: 10px;
            left: -5px;
            transform: rotate(-20deg);
            animation: wingFlap 0.8s ease-in-out infinite alternate;
        }
        .pedal {
            position: absolute;
            width: 40px;
            height: 5px;
            background: #333;
            top: 45px;
            left: -5px;
            transform-origin: left center;
            animation: pedalRotate 1s linear infinite;
        }
        .pedal::before, .pedal::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #555;
            border-radius: 50%;
            top: -2.5px;
        }
        .pedal::before { left: 0; }
        .pedal::after { right: 0; }
        .palm-tree {
            position: absolute;
            bottom: 35%;
            right: -10%;
            animation: palmMove 15s linear infinite;
        }
        .trunk {
            width: 10px;
            height: 80px;
            background: #8B4513;
            position: relative;
        }
        .leaves {
            position: absolute;
            top: -40px;
            left: -25px;
        }
        .leaf {
            width: 50px;
            height: 15px;
            background: #2E8B57;
            border-radius: 50%;
            position: absolute;
            transform-origin: left bottom;
        }
        .leaf:nth-child(1) { transform: rotate(-45deg); }
        .leaf:nth-child(2) { transform: rotate(-15deg); }
        .leaf:nth-child(3) { transform: rotate(15deg); }
        .leaf:nth-child(4) { transform: rotate(45deg); }
        .sun {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #FFD700;
            border-radius: 50%;
            top: 50px;
            right: 100px;
            box-shadow: 0 0 40px 20px rgba(255, 215, 0, 0.5);
        }
        .wave {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(transparent, rgba(17, 138, 178, 0.7));
            border-radius: 50%;
            animation: waveMove 3s ease-in-out infinite;
        }
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            top: 30%;
            animation: cloudMove 20s linear infinite;
        }
        .cloud:nth-child(1) {
            width: 60px;
            height: 30px;
            left: 10%;
            animation-delay: 0s;
        }
        .cloud:nth-child(2) {
            width: 80px;
            height: 35px;
            left: 40%;
            top: 20%;
            animation-delay: -5s;
        }
        .cloud:nth-child(3) {
            width: 50px;
            height: 25px;
            left: 70%;
            top: 25%;
            animation-delay: -10s;
        }
        @keyframes roadMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-66.66%); }
        }
        @keyframes bikeMove {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(-10px); }
        }
        @keyframes wheelRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pelicanMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(5px); }
        }
        @keyframes wingFlap {
            0% { transform: rotate(-20deg); }
            100% { transform: rotate(10deg); }
        }
        @keyframes pedalRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes palmMove {
            0% { right: -10%; }
            100% { right: 110%; }
        }
        @keyframes waveMove {
            0%, 100% { height: 15px; }
            50% { height: 25px; }
        }
        @keyframes cloudMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100vw); }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="sun"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
        
        <div class="palm-tree">
            <div class="trunk"></div>
            <div class="leaves">
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
            </div>
        </div>
        
        <div class="road">
            <div class="road-line" style="left: 0;"></div>
            <div class="road-line" style="left: 200px;"></div>
            <div class="road-line" style="left: 400px;"></div>
            <div class="road-line" style="left: 600px;"></div>
            <div class="road-line" style="left: 800px;"></div>
        </div>
        
        <div class="bike">
            <div class="wheel rear">
                <div class="spoke"></div>
                <div class="spoke"></div>
                <div class="spoke"></div>
                <div class="spoke"></div>
            </div>
            <div class="wheel front">
                <div class="spoke"></div>
                <div class="spoke"></div>
                <div class="spoke"></div>
                <div class="spoke"></div>
            </div>
            <div class="frame"></div>
            <div class="seat"></div>
            <div class="handlebar"></div>
            <div class="pedal"></div>
            
            <div class="pelican">
                <div class="pelican-body">
                    <div class="pelican-head"></div>
                    <div class="pelican-beak"></div>
                    <div class="pelican-wing"></div>
                </div>
            </div>
        </div>
        
        <div class="wave"></div>
    </div>
    
    <script>
        // 动态创建重复的道路线
        document.addEventListener('DOMContentLoaded', () => {
            const road = document.querySelector('.road');
            for (let i = 1; i < 10; i++) {
                const line = document.createElement('div');
                line.className = 'road-line';
                line.style.left = (i * 200) + 'px';
                road.appendChild(line);
            }
        });
    </script>
</body>
</html>
